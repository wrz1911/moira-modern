name: Build AppImage

# 手动触发或推送 v* 标签时打包 Linux AppImage(自带精简 JRE)
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 Release 所需

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装最新 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: 编译
        run: |
          CP="out:lib/swt.jar:lib/org.eclipse.jface_3.39.100.jar:lib/org.eclipse.equinox.common_3.20.400.jar:lib/org.eclipse.core.commands_3.12.500.jar:lib/jfreesvg-3.4.4.jar:src"
          mkdir -p out
          javac -encoding UTF-8 -d out -cp "$CP" $(find src -name '*.java')

      - name: 组装 AppDir
        run: |
          APP=Moira
          DIST=dist/AppDir
          mkdir -p "$DIST/usr/bin" "$DIST/usr/share/applications"
          # jlink 精简 JRE(SWT/AWT/prefs 所需模块);启动脚本按 usr/runtime 路径查找
          jlink --add-modules java.base,java.desktop,java.prefs,java.logging \
              --strip-debug --no-man-pages --no-header-files \
              --output "$DIST/usr/runtime"
          mkdir -p "$DIST/usr/lib/moira"
          cp -r out lib src "$DIST/usr/lib/moira/"
          cp -r ephe example help icon moira_s.prop moira_t.prop cities.prop \
              moira-gtk.css GPL_license.txt LGPL_license.txt SEPL_license.txt \
              readme.html moira.ico splash.png WMM*.COF "$DIST/usr/lib/moira/"
          cat > "$DIST/usr/bin/moira" << 'LAUNCH'
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          BASE="$HERE/../lib/moira"
          cd "$BASE"
          export SWT_GTK4=1
          exec "$HERE/../runtime/bin/java" --enable-native-access=ALL-UNNAMED \
              -cp "out:lib/swt.jar:lib/org.eclipse.jface_3.39.100.jar:lib/org.eclipse.equinox.common_3.20.400.jar:lib/org.eclipse.core.commands_3.12.500.jar:lib/jfreesvg-3.4.4.jar:src" \
              org.athomeprojects.moira.Moira "$@"
          LAUNCH
          chmod +x "$DIST/usr/bin/moira"
          # AppImage 入口:AppDir 根必须存在 AppRun(链接到 usr/bin/moira)
          ln -s usr/bin/moira "$DIST/AppRun"
          cat > "$DIST/usr/share/applications/moira.desktop" << 'DESK'
          [Desktop Entry]
          Name=Moira
          Comment=七政四余(果老星宗)排盘软件
          Exec=moira
          Icon=moira
          Type=Application
          Categories=Education;Science;
          DESK
          cp "$DIST/usr/share/applications/moira.desktop" "$DIST/moira.desktop"
          # 图标:splash.png 为原版启动画面,直接用作应用图标
          cp splash.png "$DIST/moira.png"

      - name: 打包 AppImage
        run: |
          TOOL=appimagetool-x86_64.AppImage
          curl -sL -o "$TOOL" \
              "https://github.com/AppImage/appimagetool/releases/download/continuous/$TOOL"
          chmod +x "$TOOL"
          # 产物版本号用 Release 版本(tag 名去 v 前缀,如 v1.0.0 → 1.0.0)
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "main" ] || [ "$VERSION" = "master" ]; then
            VERSION=$(grep -o 'Version [0-9.]*' readme.html | head -1 | awk '{print $2}')
          fi
          ARCH=x86_64 "./$TOOL" dist/AppDir \
              "dist/moira-modern-${VERSION}.appimage"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Moira-AppImage
          path: dist/*.appimage

      - name: 发布 Release(仅 tag 推送)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.appimage
          name: Moira ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
